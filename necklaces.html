<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zyrazin | Necklaces</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #fffafb;
    color: #33272b;
    font-family: Georgia, "Times New Roman", serif;
}

header {
    background: #fffafb;
    border-bottom: 1px solid #ead9de;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    min-height: 82px;
    padding: 12px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    text-decoration: none;
    color: #9d6879;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 7px;
}

nav {
    display: flex;
    gap: 22px;
}

nav a {
    text-decoration: none;
    color: #49383e;
    font-size: 16px;
}

.page-title {
    text-align: center;
    padding: 40px 20px 25px;
}

.page-title h1 {
    margin: 0;
    font-size: 40px;
}

.page-title p {
    color: #8b737b;
}

.products {
    max-width: 1050px;
    margin: auto;
    padding: 10px 20px 50px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
}

.product-card {
    background: white;
    border: 1px solid #ead9de;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 7px 22px rgba(80,45,55,.06);
}

.product-image {
    width: 100%;
    height: 250px;
    object-fit: cover;
    display: block;
    background: #f8eef1;
}

.product-info {
    padding: 15px;
}

.product-name {
    margin: 0 0 7px;
    font-size: 18px;
}

.price {
    color: #9b6275;
    font-size: 19px;
    font-weight: bold;
}

.stock {
    color: #8f596b;
    font-size: 13px;
    margin-bottom: 12px;
}

.view-btn,
.add-cart-btn,
.checkout-btn,
.payment-btn,
.paid-btn,
.instagram-btn,
.copy-btn {
    border: none;
    border-radius: 25px;
    padding: 13px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px;
    cursor: pointer;
}

.view-btn,
.add-cart-btn,
.checkout-btn,
.payment-btn,
.paid-btn,
.instagram-btn {
    background: #a66c7d;
    color: white;
}

.view-btn {
    width: 100%;
}

.cart-section {
    max-width: 1050px;
    margin: auto;
    padding: 20px;
}

.cart-box {
    background: white;
    border: 1px solid #ead9de;
    border-radius: 22px;
    padding: 25px;
}

.cart-title {
    text-align: center;
}

.cart-empty {
    text-align: center;
    color: #8d777e;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 0;
    border-bottom: 1px solid #eee0e4;
}

.cart-item-code {
    color: #9a7a83;
    font-size: 13px;
}

.cart-item-price {
    color: #9b6275;
    font-weight: bold;
}

.remove-btn {
    border: none;
    background: none;
    color: #b16c7c;
    cursor: pointer;
}

.cart-total {
    text-align: center;
    font-size: 21px;
    font-weight: bold;
    margin: 22px;
}

.checkout-btn {
    width: 100%;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(35,25,29,.65);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 18px;
}

.modal-content {
    background: white;
    width: min(500px,100%);
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 24px;
    padding: 24px;
    position: relative;
}

.close {
    position: absolute;
    right: 18px;
    top: 10px;
    font-size: 29px;
    cursor: pointer;
}

.modal-image {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    border-radius: 17px;
}

.modal-title {
    font-size: 26px;
}

.modal-price {
    color: #9b6275;
    font-size: 21px;
    font-weight: bold;
}

.add-cart-btn {
    width: 100%;
    margin-top: 17px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #dfcbd1;
    border-radius: 10px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;
}

.form-group textarea {
    min-height: 80px;
}

.checkout-summary {
    background: #fff5f7;
    border-radius: 12px;
    padding: 14px;
    margin: 18px 0;
}

.payment-btn,
.paid-btn {
    width: 100%;
}

.qr-title,
.confirm-title {
    text-align: center;
}

.qr-image {
    width: 100%;
    max-width: 300px;
    display: block;
    margin: 15px auto;
    border-radius: 12px;
}

.payment-note,
.confirm-text,
.small-note {
    text-align: center;
    color: #77636a;
    line-height: 1.5;
}

.order-message {
    background: #fff5f7;
    border: 1px solid #ead9de;
    border-radius: 12px;
    padding: 15px;
    margin: 18px 0;
    white-space: pre-line;
    font-size: 14px;
    line-height: 1.6;
}

.copy-btn {
    width: 100%;
    background: #ead1d8;
    color: #49383e;
}

.instagram-btn {
    width: 100%;
    margin-top: 10px;
}

footer {
    text-align: center;
    padding: 30px;
    border-top: 1px solid #ead9de;
    color: #8b737b;
}

@media(max-width:700px) {

    .header-inner {
        flex-direction: column;
        gap: 12px;
    }

    .logo {
        font-size: 23px;
        letter-spacing: 4px;
    }

    nav {
        gap: 15px;
    }

    nav a {
        font-size: 13px;
    }

    .products {
        gap: 13px;
        padding: 10px 12px 40px;
    }

    .product-image {
        height: 200px;
    }

    .product-name {
        font-size: 15px;
    }

    .price {
        font-size: 17px;
    }

    .view-btn {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <a href="index.html" class="logo">
            ZYRAZIN
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="necklaces.html">Necklaces</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
        </nav>

    </div>
</header>

<section class="page-title">
    <h1>Necklaces</h1>
    <p>Elegant pieces selected for you</p>
</section>

<section class="products" id="products"></section>

<section class="cart-section">

    <div class="cart-box">

        <h2 class="cart-title">Your Cart</h2>

        <div id="cartItems"></div>

        <div class="cart-total">
            Total: ₹<span id="cartTotal">0</span>
        </div>

        <button
            class="checkout-btn"
            onclick="openCheckout()">

            Proceed to Checkout

        </button>

    </div>

</section>


<!-- PRODUCT MODAL -->

<div class="modal" id="productModal">

    <div class="modal-content">

        <span class="close" onclick="closeProduct()">×</span>

        <img id="modalImage"
             class="modal-image">

        <h2 id="modalTitle"
            class="modal-title">
        </h2>

        <div id="modalPrice"
             class="modal-price">
        </div>

        <button
            class="add-cart-btn"
            onclick="addSelectedProduct()">

            Add to Cart

        </button>

    </div>

</div>


<!-- CHECKOUT MODAL -->

<div class="modal" id="checkoutModal">

    <div class="modal-content">

        <span class="close"
              onclick="closeCheckout()">×</span>

        <h2 style="text-align:center;">
            Your Details
        </h2>

        <div class="form-group">

            <label>Full Name</label>

            <input
                id="customerName"
                type="text"
                placeholder="Enter your name">

        </div>

        <div class="form-group">

            <label>Phone Number</label>

            <input
                id="customerPhone"
                type="tel"
                placeholder="Enter your phone number">

        </div>

        <div class="form-group">

            <label>Address</label>

            <textarea
                id="customerAddress"
                placeholder="Enter your full address">
            </textarea>

        </div>

        <div class="form-group">

            <label>PIN Code</label>

            <input
                id="customerPin"
                type="text"
                placeholder="Enter PIN code">

        </div>

        <div class="checkout-summary">

            Total:
            <strong>
                ₹<span id="checkoutTotal">0</span>
            </strong>

        </div>

        <button
            class="payment-btn"
            onclick="continueToPayment()">

            Continue to Payment

        </button>

    </div>

</div>


<!-- PAYMENT MODAL -->

<div class="modal" id="paymentModal">

    <div class="modal-content">

        <span class="close"
              onclick="closePayment()">×</span>

        <h2 class="qr-title">
            Complete Your Payment
        </h2>

        <p class="payment-note">
            Scan the QR code below to complete your payment.
        </p>

        <img
            src="payment-qr.png.jpg"
            class="qr-image"
            alt="Zyrazin Payment QR">

        <p style="text-align:center;">
            UPI ID:<br>
            <strong>
                jasiyajunaid2002-1@oksbi
            </strong>
        </p>

        <button
            class="paid-btn"
            onclick="paymentCompleted()">

            I Have Completed Payment

        </button>

    </div>

</div>
